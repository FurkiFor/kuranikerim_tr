name: Zernio (TikTok + Instagram)

# TikTok ve Instagram paylaşımı + istatistikleri Zernio API ile (zernio.py).
# Claude'un bulut oturumu zernio.com'a doğrudan bağlanamadığı için çağrılar burada yapılır.
# Gerekli secret: ZERNIO_API_KEY (Settings → Secrets and variables → Actions → New repository secret).
#
#   push zernio/queue.json  -> zernio_id'si olmayan kayıtları planlar, sonucu queue.json + state.json'a yazar
#   her gün 08:20 (Dubai)   -> istatistik: analytics/zernio.json, analytics/ozet.md, analytics/zernio-gecmis.jsonl
#   elle                    -> Actions → Zernio → Run workflow → cmd: queue | stats | both
on:
  push:
    branches: [main]
    paths: ['zernio/queue.json']
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      cmd:
        description: "queue (planla), stats (istatistik) ya da both"
        default: both
        type: choice
        options: [queue, stats, both]

permissions:
  contents: write

concurrency:
  group: zernio
  cancel-in-progress: false

jobs:
  zernio:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      CMD: ${{ github.event_name == 'push' && 'queue' || github.event_name == 'schedule' && 'stats' || inputs.cmd }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check secret
        run: |
          if [ -z "$ZERNIO_API_KEY" ]; then
            echo "::warning::ZERNIO_API_KEY secret'ı yok — Settings → Secrets and variables → Actions'a ekleyin. Zernio adımları atlandı."
            echo "CMD=none" >> "$GITHUB_ENV"; exit 0
          fi
          python zernio.py accounts

      - name: Queue
        if: env.CMD == 'queue' || env.CMD == 'both'
        run: python zernio.py queue

      - name: Stats
        if: always() && (env.CMD == 'stats' || env.CMD == 'both')
        run: python zernio.py stats

      - name: Commit
        if: always() && env.CMD != 'none'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json zernio/queue.json analytics 2>/dev/null || true
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -q -m "zernio: $CMD (GitHub Actions)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
