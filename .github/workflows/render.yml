name: Render videos

# Videoları GitHub'ın sunucularında üretir ve videos/ altına commit eder.
# Ses: ElevenLabs (Seçkin Yiğit, eleven_v4 — karanlık belgesel tonu).
#   mcp    : sesler Claude'un ElevenLabs bağlayıcısıyla üretilir ve voiceovers/<id>.json olarak push edilir;
#            bu push iş akışını kendiliğinden başlatır (mp3'ler burada indirilir, 2 saat geçerli adresler)
#   eleven : ElevenLabs API (ELEVENLABS_API_KEY secret'ı gerekir; yoksa EMA'ya düşer)
# Elle ya da günlük görev tarafından tetiklenir:
#   Actions → Render videos → Run workflow → ids: "v015 v016 v017"
on:
  push:
    branches: [main]
    paths: ['voiceovers/*.json']
  workflow_dispatch:
    inputs:
      ids:
        description: "Üretilecek konu id'leri, boşlukla ayrılmış (ör. v015 v016 v017)"
        required: true
      voice:
        description: "Ses: mcp (voiceovers/<id>.json), eleven (ElevenLabs API), ema (EMA Lightning) ya da dfki (Piper)"
        default: mcp
        type: choice
        options: [mcp, eleven, ema, dfki]
      speed:
        description: "Konuşma hızı (yalnızca ema/dfki; 1 = normal, küçük = yavaş)"
        default: "0.85"
      pause:
        description: "Cümle arası duraklama çarpanı (yalnızca ema/dfki)"
        default: "1.5"
      music:
        description: "Fon müziği: ilahi (ney + dem + bendir), dark (karanlık pad) ya da soft"
        default: ilahi
        type: choice
        options: [ilahi, dark, soft]
      music_volume:
        description: "Fon müziği seviyesi (0 = müziksiz)"
        default: "0.2"

permissions:
  contents: write

concurrency:
  group: render-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KT_VOICE: ${{ inputs.voice || 'mcp' }}
      KT_SPEED: ${{ inputs.speed || '0.85' }}
      KT_PAUSE: ${{ inputs.pause || '1.5' }}
      KT_MUSIC_STYLE: ${{ inputs.music || 'ilahi' }}
      KT_MUSIC: ${{ inputs.music_volume || '0.2' }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      IDS: ${{ inputs.ids }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20

      # push ile başladıysa: bu push'ta değişen voiceovers/<id>.json dosyalarından id'leri bul
      - name: Resolve ids
        if: github.event_name == 'push'
        run: |
          ids=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'voiceovers/*.json' 2>/dev/null \
                | sed -n 's#^voiceovers/\(v[0-9]*\)\.json$#\1#p' | sort -u | tr '\n' ' ')
          [ -n "$ids" ] || ids=$(git show --name-only --format= HEAD -- 'voiceovers/*.json' | sed -n 's#^voiceovers/\(v[0-9]*\)\.json$#\1#p' | tr '\n' ' ')
          echo "IDS=$ids" >> "$GITHUB_ENV"; echo "id'ler: $ids"
          [ -n "$ids" ] || { echo "değişen manifest yok"; exit 1; }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 23 Ekim: apt-get update 25+ dk takıldı → zaman aşımı + yeniden deneme; update başarısızsa yine kurmayı dene
      - name: System packages
        timeout-minutes: 12
        run: |
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20"
          timeout 300 sudo apt-get $APT update -qq || echo "::warning::apt-get update zaman aşımı/hata, mevcut listelerle devam"
          for i in 1 2 3; do
            timeout 300 sudo apt-get $APT install -y -qq --no-install-recommends ffmpeg libraqm0 libfribidi0 libharfbuzz0b libgl1 libegl1 libfontconfig1 >/dev/null && break
            echo "::warning::apt-get install deneme $i başarısız"; sleep 10
          done
          command -v ffmpeg

      # eleven seçili ama anahtar yoksa günlük akış durmasın: EMA'ya düş ve uyar
      - name: Resolve voice
        run: |
          if [ "$KT_VOICE" = "eleven" ] && [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::ELEVENLABS_API_KEY secret'ı yok — bu çalıştırma EMA sesiyle üretiliyor"
            echo "KT_VOICE=ema" >> "$GITHUB_ENV"
          fi

      - name: Python packages
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q skia-python pillow numpy scipy
          if [ "$KT_VOICE" = "ema" ]; then
            python -m pip install -q torch --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -q ema-lightning
          fi
          if [ "$KT_VOICE" = "dfki" ]; then python -m pip install -q sherpa-onnx; fi

      - name: Fetch MCP voiceovers
        if: env.KT_VOICE == 'mcp'
        run: |
          for id in $IDS; do
            if python -c "import json,sys; t={t['id']:t for t in json.load(open('topics.json'))}['$id']; sys.exit(0 if t.get('tur')=='kart' else 1)"; then
              echo "$id: ayet kartı (tilavet/müzik, TTS yok)"; continue
            fi
            [ -f "voiceovers/$id.json" ] || { echo "::error::voiceovers/$id.json yok — önce sesler MCP ile üretilmeli"; exit 1; }
            python mcp_voice.py check "$id" && python mcp_voice.py fetch "$id"
          done

      # tilavet kartları: gerçek kâri kaydı (Ali el-Huzeyfi) — eksik ayet dosyalarını everyayah'tan indir
      - name: Fetch recitations
        run: |
          mkdir -p recitations/hudhaify
          for f in $(python kart.py --need $IDS); do
            [ -s "recitations/hudhaify/$f" ] && continue
            curl -fsSL --retry 4 --retry-delay 3 -o "recitations/hudhaify/$f" "https://everyayah.com/data/Hudhaify_128kbps/$f" \
              || { echo "::error::tilavet indirilemedi: $f"; exit 1; }
            echo "indirildi: $f ($(ffprobe -v error -show_entries format=duration -of csv=p=0 recitations/hudhaify/$f) sn)"
          done

      - name: Cache voice models
        if: env.KT_VOICE != 'eleven' && env.KT_VOICE != 'mcp'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            models
          key: voices-v1

      # ElevenLabs parçaları önbellekte: aynı metin yeniden üretilirken tekrar ücretlendirilmez
      - name: Cache ElevenLabs audio
        if: env.KT_VOICE == 'eleven'
        uses: actions/cache@v4
        with:
          path: models/el_cache
          key: el-${{ github.run_id }}
          restore-keys: el-

      - name: Validate ids
        run: |
          for id in $IDS; do
            [[ "$id" =~ ^v[0-9]{3,4}$ ]] || { echo "geçersiz id: $id"; exit 1; }
            python -c "import json,sys; ids={t['id'] for t in json.load(open('topics.json'))}; sys.exit(0 if '$id' in ids else 1)" \
              || { echo "topics.json'da yok: $id"; exit 1; }
          done

      - name: Voice sample
        if: env.KT_VOICE == 'ema' || env.KT_VOICE == 'dfki'
        run: |
          python - <<'EOF'
          import voice, wave, numpy as np
          a, _ = voice.synth_segment("Rahmân ve Rahîm olan Allah'ın adıyla. Hamd, âlemlerin Rabbi Allah'a mahsustur.")
          pcm = (np.clip(a, -1, 1) * 32767).astype(np.int16)
          with wave.open("voice-sample.wav", "wb") as w:
              w.setnchannels(1); w.setsampwidth(2); w.setframerate(voice.SR); w.writeframes(pcm.tobytes())
          print("ses örneği:", len(a) / voice.SR, "sn @", voice.SR)
          EOF

      - name: Render
        run: |
          pids=()
          for id in $IDS; do
            python render.py "$id" > "render-$id.log" 2>&1 &
            pids+=($!)
          done
          fail=0
          for p in "${pids[@]}"; do wait "$p" || fail=1; done
          cat render-*.log
          exit $fail

      - name: Check videos
        run: |
          for id in $IDS; do
            ffprobe -v error -show_entries format=duration -of csv=p=0 "videos/$id.mp4"
            ffmpeg -nostats -i "videos/$id.mp4" -af ebur128 -f null - 2>&1 | grep -A1 "Integrated loudness" | tail -1
          done

      - uses: actions/upload-artifact@v4
        with:
          name: render-${{ github.run_id }}
          if-no-files-found: ignore
          path: |
            voice-sample.wav
            render-*.log
          retention-days: 7

      - name: Commit videos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for id in $IDS; do git add "videos/$id.mp4"; [ -d "voiceovers/$id" ] && git add "voiceovers/$id"; done
          git add recitations 2>/dev/null || true
          if git diff --cached --quiet; then echo "değişiklik yok"; exit 0; fi
          git commit -q -m "videos: $IDS ($KT_VOICE sesi, GitHub Actions)"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
